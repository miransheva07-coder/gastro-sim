name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site (app + speech engine + Japanese model)
        run: |
          mkdir -p site/vendor site/models
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png site/
          curl -fsSL -o site/vendor/vosk.js https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js
          curl -fsSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ja-0.22.zip
          unzip -q model.zip
          tar -czf site/models/ja.tar.gz vosk-model-small-ja-0.22
          ls -la site site/vendor site/models
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
